  const Learn = (() => {
    const card = $("story"), body = $("s-body");

          const bs = basisEl(q.basis); if (bs) body.append(bs);

      store.set("ltgov-hint", "1"); hint.hidden = false;
    }
    return { ready, render, open, isOpen: () => opened };
  })();

  /* ---------- modes, language, boot ---------- */
  let mode = null, booted = false, errKind = null;
  function switchMode(m) {
    if (m === mode) return;
    if ((m === "parl" || m === "eu") && Learn.active()) Learn.exit(true);
    if (m === "parl" && !D.hasSeimas) return;
    if (m === "eu" && !D.hasEu) return;
    hideDetails(); mode = m;
    $("m-orbit").setAttribute("aria-pressed", String(m === "orbit")); $("m-parl").setAttribute("aria-pressed", String(m === "parl"));
    $("m-eu").setAttribute("aria-pressed", String(m === "eu"));
    $("v-orbit").hidden = m !== "orbit"; $("v-parl").hidden = m !== "parl"; $("v-eu").hidden = m !== "eu";
    $("hint").textContent = m === "parl" ? t("hintParl") : m === "eu" ? t("hintEu") : t("hint");
    if (m === "orbit") Orbit.show(!booted); else if (m === "parl") Parliament.show(); else if (m === "eu") EuView.show();
    booted = true;
    syncUrl();
  }
  $("m-orbit").onclick = () => switchMode("orbit");
  $("m-parl").onclick = () => switchMode("parl");
  $("m-eu").onclick = () => switchMode("eu");
  function applyLayerLabels() {
    const b = $("m-eu"), meta = layerMeta("eu");
    const full = tx((D && D.eu && D.eu.name) || meta?.name) || t("eu");
    b.textContent = t("eu"); b.title = full; b.setAttribute("aria-label", full);
    b.hidden = !(D && D.hasEu);
  }
  function applyLang() {
    document.documentElement.lang = lang;
    $("brand-name").textContent = t("brand");
    $("brand-sub").textContent = D ? fmtDate(D.updated_at.slice(0, 7)) : "";
    $("m-orbit").textContent = t("orbit"); $("m-parl").textContent = t("parl");
    applyLayerLabels();
    $("modes").setAttribute("aria-label", t("views")); $("langs").setAttribute("aria-label", t("langs"));
    $("btn-en").setAttribute("aria-pressed", String(lang === "en")); $("btn-lt").setAttribute("aria-pressed", String(lang === "lt"));
    $("hint").textContent = mode === "parl" ? t("hintParl") : mode === "eu" ? t("hintEu") : t("hint");
    sInput.placeholder = t("search"); sInput.setAttribute("aria-label", t("search")); sToggle.setAttribute("aria-label", t("openSearch"));
    $("p-prev").setAttribute("aria-label", t("prev")); $("p-next").setAttribute("aria-label", t("next")); $("p-close").setAttribute("aria-label", t("close"));
    $("share-toggle").setAttribute("aria-label", t("share"));
    $("page-title").textContent = t("brand");
    if (document.body.classList.contains("embed")) document.querySelector(".brand").setAttribute("aria-label", t("openFull"));
    if (!embedDlg.hidden) openEmbed(true);
    $("loading-text").textContent = t("loading"); $("retry").textContent = t("tryAgain");
  }
  function setLang(l) {
    if (l === lang) return; lang = l; store.set("ltgov-lang", l); applyLang(); showError(); syncUrl(); openShare(false); Learn.rerender(); Menu.render();
    if (!D) return;
    const cur = current;
    Orbit.rebuild(); Parliament.rebuild();
    if (mode === "orbit") Orbit.show(false); else if (mode === "parl") Parliament.show(); else if (mode === "eu") EuView.show();
    if (cur && mode === "orbit" && BY[cur]) Orbit.select(cur, true);
    if (cur && mode === "eu" && D.hasEu && D.eu.meps.some(m => m.id === cur)) EuView.focusMep(cur);
    renderResults();
  }
  $("btn-en").onclick = () => setLang("en");
  $("btn-lt").onclick = () => setLang("lt");
  addEventListener("resize", () => { if (mode === "orbit") Orbit.resize(); });

  async function boot() {
    $("error").hidden = true; $("loading").hidden = false;
    for (const b of document.querySelectorAll(".bar button")) b.disabled = true;
    const err = await load().catch(e => { console.error("Data load failed:", e); return "data"; });
    $("loading").hidden = true;
    for (const b of document.querySelectorAll(".bar button")) b.disabled = !!err && !["btn-en", "btn-lt"].includes(b.id);
    if (!err && !D.hasSeimas) $("m-parl").disabled = true;
    if (!err && !D.hasEu) $("m-eu").hidden = true;
    if (!err) Menu.ready();
    if (err) { errKind = err; showError(); return; }
    applyLang();
    route();
  }
  $("retry").onclick = () => { errKind = null; boot(); };
  // language buttons stay usable during errors so the message can be read in either language
  function showError() { if (!errKind) return; $("error-text").textContent = errKind === "network" ? t("errorNetwork") : t("errorData"); $("error").hidden = false; }
  applyLang();
  // hooks for automated checks (read-only)
  window.__ltgov = { menu: () => Menu.isOpen(), learn: () => Learn.state(), orbit: () => Orbit.state(), parl: () => Parliament.state(), eu: () => EuView.state(), current: () => current, mode: () => mode, lang: () => lang, hasEu: () => !!(D && D.hasEu) };
  boot();
})();
</script>
</body>
</html>
